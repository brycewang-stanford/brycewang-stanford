  <text x="614.0" y="338" text-anchor="middle">-4</text><text x="658.3" y="338" text-anchor="middle">-3</text><text x="702.6" y="338" text-anchor="middle">-2</text><text x="746.9" y="338" text-anchor="middle">-1</text><text x="791.1" y="338" text-anchor="middle">0</text><text x="835.4" y="338" text-anchor="middle">1</text><text x="879.7" y="338" text-anchor="middle">2</text><text x="924.0" y="338" text-anchor="middle">3</text>
  <line x1="769.0" x2="769.0" y1="90" y2="318" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="777.0" y="100" fill="#F59E0B">treatment</text>
  <text class="note" x="948" y="374" text-anchor="end" fill="#B4BECB">real output: StatsPAI, Callaway-Sant'Anna on mpdta replica</text>
</g>
