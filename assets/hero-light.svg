<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d">
<title id="t">Bryce Wang: agent-native infrastructure for empirical research</title>
<desc id="d">A terminal runs a Callaway-Sant'Anna event study with StatsPAI and the resulting chart draws itself: flat pre-trends, then a negative effect after treatment.</desc>
<style>
    .cv{transform-box:fill-box;transform-origin:right center;transform:scaleX(0)}
    @keyframes type{from{transform:scaleX(1)}to{transform:scaleX(0)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes show{from{opacity:0}}
    @keyframes draw{from{stroke-dashoffset:1}}
    @keyframes pop{from{opacity:0;transform:scale(.3)}}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}}
    @keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
    .cur{animation:show .01s 4.17s backwards,blink 1.1s steps(1) 4.17s infinite}
    .name{animation:rise .7s ease-out .05s backwards}
    .tag{animation:rise .7s ease-out .2s backwards}
    .es{stroke-dasharray:1;animation:draw 1.2s ease-in-out 4.27s backwards}
    .band{animation:show .9s ease-out 5.27s backwards}
    .note{animation:show .8s ease-out 5.67s backwards}
    .pt{transform-box:fill-box;transform-origin:center}
    .glow{animation:drift 9s ease-in-out infinite alternate}
    .cv0{animation:type 0.66s steps(30) 0.50s backwards}.cv1{animation:type 0.79s steps(36) 1.28s backwards}.cv2{animation:type 0.88s steps(40) 2.19s backwards}.cv3{animation:type 0.86s steps(39) 3.19s backwards}.pt0{animation:pop .35s ease-out 4.42s backwards}.pt1{animation:pop .35s ease-out 4.56s backwards}.pt2{animation:pop .35s ease-out 4.70s backwards}.pt3{animation:pop .35s ease-out 4.84s backwards}.pt4{animation:pop .35s ease-out 4.98s backwards}.pt5{animation:pop .35s ease-out 5.12s backwards}.pt6{animation:pop .35s ease-out 5.26s backwards}.pt7{animation:pop .35s ease-out 5.40s backwards}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
  <linearGradient id="brand" x1="0" x2="1"><stop offset="0" stop-color="#0EA5E9"/><stop offset=".5" stop-color="#22C55E"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
  <radialGradient id="g1"><stop offset="0" stop-color="#0EA5E9" stop-opacity="0.12"/><stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#EDF1F6"/></pattern>
  <clipPath id="clip"><rect x=".5" y=".5" width="999" height="399" rx="16"/></clipPath>
</defs>
<rect x=".5" y=".5" width="999" height="399" rx="16" fill="#FFFFFF" stroke="#D8DEE6"/>
<g clip-path="url(#clip)">
  <rect width="1000" height="400" fill="url(#dots)"/>
  <ellipse class="glow" cx="770" cy="150" rx="330" ry="230" fill="url(#g1)"/>
  <rect width="1000" height="4" fill="url(#brand)"/>
</g>

<text x="48" y="62" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#57667A" letter-spacing="1.5">DATA SCIENTIST, STANFORD REAP  /  FOUNDER, COPAPER.AI</text>
<text class="name" x="46" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="62" font-weight="800" fill="#0F172A" letter-spacing="-1.5">Bryce Wang</text>
<text class="tag" x="48" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#57667A">Agent-native infrastructure for <tspan fill="url(#brand)" font-weight="700">empirical research</tspan></text>

<rect x="48" y="192" width="430" height="140" rx="10" fill="#F3F6FA" stroke="#D8DEE6"/>
<g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5">
<text x="66" y="233" textLength="246.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#B4BECB">&gt;&gt;&gt; </tspan><tspan fill="#0F172A">gt = sp.callaway_santanna(</tspan></text><rect class="cv cv0" x="66" y="218" width="250.0" height="21" fill="#F3F6FA"/><text x="66" y="257" textLength="295.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#B4BECB">... </tspan><tspan fill="#0F172A">    data=mp, y=&quot;lemp&quot;, t=&quot;year&quot;,</tspan></text><rect class="cv cv1" x="66" y="242" width="299.2" height="21" fill="#F3F6FA"/><text x="66" y="281" textLength="328.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#B4BECB">... </tspan><tspan fill="#0F172A">    i=&quot;countyreal&quot;, g=&quot;first_treat&quot;)</tspan></text><rect class="cv cv2" x="66" y="266" width="332.0" height="21" fill="#F3F6FA"/><text x="66" y="305" textLength="319.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#B4BECB">&gt;&gt;&gt; </tspan><tspan fill="#0F172A">sp.aggte(gt, type=&quot;dynamic&quot;).plot()</tspan></text><rect class="cv cv3" x="66" y="290" width="323.8" height="21" fill="#F3F6FA"/>
<rect class="cur" x="388.8" y="291" width="8" height="17" fill="#0EA5E9"/>
</g>
<g transform="translate(48,352)"><rect width="103" height="26" rx="13" fill="#F6F8FB" stroke="#D8DEE6"/><circle cx="14" cy="13" r="3.5" fill="#F59E0B"/><text x="24" y="17.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#57667A" textLength="73.0" lengthAdjust="spacingAndGlyphs">6.6k stars</text></g><g transform="translate(159.0,352)"><rect width="96" height="26" rx="13" fill="#F6F8FB" stroke="#D8DEE6"/><circle cx="14" cy="13" r="3.5" fill="#22C55E"/><text x="24" y="17.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#57667A" textLength="65.7" lengthAdjust="spacingAndGlyphs">JOSS 2026</text></g><g transform="translate(262.7,352)"><rect width="125" height="26" rx="13" fill="#F6F8FB" stroke="#D8DEE6"/><circle cx="14" cy="13" r="3.5" fill="#8C1515"/><text x="24" y="17.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#57667A" textLength="94.9" lengthAdjust="spacingAndGlyphs">Stanford REAP</text></g>

<g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#57667A">
  <text x="590" y="62" font-size="13" fill="#0F172A" font-weight="600">ATT by event time</text>
